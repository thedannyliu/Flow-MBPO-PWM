name: CPU checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  cpu:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check shell syntax
        run: git ls-files -z '*.sh' '*.sbatch' | xargs -0 -r -n 1 bash -n
      - name: Install CPU PyTorch
        run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Validate CPU entry points
        run: |
          python -m pip install numpy pytest
          python -m pip install -e . --no-deps
          python -m pytest tests
          python scripts/experiments/single_task_online/build_manifest.py --stage smoke --output /tmp/smoke.csv
          python scripts/experiments/single_task_online/split_manifest_by_cluster.py --manifest /tmp/smoke.csv
