config:
  _target_: flow_mbpo_pwm.envs.mjlab_pwm_adapter.create_mjlab_pwm_env
  task_id: Mjlab-Tracking-Flat-Unitree-G1
  strict_task_id_match: true
  task_id_fallbacks: [Mjlab-Tracking-Flat-Unitree-G1-No-State-Estimation]
  num_envs: 128
  device: ${general.device}
  seed: ${general.seed}
  episode_length: 1000
  action_repeat: 2
  no_grad: False

  # Observation extraction
  obs_key: state
  obs_key_candidates: [state, policy, observation, obs]

  # Done/reset safety checks for replay correctness
  strict_terminal_obs: true
  expect_auto_reset: true
  fail_on_missing_terminal_obs: false
  warn_missing_terminal_obs_every: 50

  # Let MJLab resolve its default motion asset unless a specific motion file
  # is intentionally injected via env.config.mjlab_env_kwargs.motion_file or
  # MJLAB_MOTION_FILE.
  mjlab_env_kwargs: {}
